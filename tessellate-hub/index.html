<!DOCTYPE html>
<html lang="en" data-theme="white">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>My Tessellate — work hub walkthrough</title>
<style>
/* Design tokens — light product surface, steel-teal accent. */
:root{
  --bg:#F5F5F5; --card:#FFFFFF; --card2:#F0F0F0; --card3:#FAFAF9;
  --border:#E5E5E5; --border2:#DEDEDE; --border-strong:#CCCCCC;
  --text:#1A1A1A; --text2:#444444; --muted:#6B6B6B; --muted2:#6E6A63;
  --accent:#14657C; --accent-dark:#0E4C5E; --accent-bg:#E8F1F4; --accent-border:#A9CBD5;
  --pos:#0A7A2E; --pos-bg:#EDF7F2; --neg:#B32B2B; --neg-bg:#FDF0F0;
  --warn:#8A5E00; --warn-bg:#FBF3E2;
  --s1:#2a78d6; --s2:#eb6834;
  --grid:#E1E0D9; --axis:#C3C2B7; --ink-muted:#77756F;
  --shadow:0 1px 3px rgba(0,0,0,.05), 0 1px 2px rgba(0,0,0,.03);
  --shadow-md:0 6px 18px rgba(0,0,0,.09), 0 2px 5px rgba(0,0,0,.04);
  --shadow-lg:0 18px 48px rgba(0,0,0,.16), 0 4px 12px rgba(0,0,0,.06);
  --r:8px; --r-lg:12px;
  --sans:'Segoe UI',system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; font-family:var(--sans); font-size:14px; line-height:1.45;
  color:var(--text); background:var(--bg); -webkit-font-smoothing:antialiased;
  display:flex; flex-direction:column; height:100vh; overflow:hidden;
}
svg.i{width:16px;height:16px;flex:0 0 auto;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;display:block}
svg.i.lg{width:19px;height:19px}
button{font-family:inherit}

.ribbon{
  background:var(--text); color:#fff; font-size:11.5px; letter-spacing:.02em;
  padding:6px 18px; display:flex; flex-wrap:wrap; align-items:center; gap:3px 10px; flex:0 0 auto; min-width:0;
}
.ribbon strong{font-weight:600}
.ribbon .sp{flex:1;min-width:0}
.ribbon strong,.ribbon span{min-width:0;overflow-wrap:anywhere}
.ribbon span.dim{color:rgba(255,255,255,.62)}
.topbar,.brand{min-width:0}

.topbar{
  flex:0 0 auto; background:var(--card); border-bottom:1px solid var(--border);
  min-height:52px; display:flex; align-items:center; gap:14px; padding:0 16px;
}
.brand{display:flex;align-items:center;gap:11px;font-size:15px;letter-spacing:-.01em}
.brandmark{height:29px;width:auto;display:block;color:var(--text);flex:0 0 auto}
.brand .bname{font-weight:600;border-left:1px solid var(--border2);padding-left:11px}
.brand .sub{color:var(--muted);font-weight:400;font-size:12.5px;border-left:1px solid var(--border2);padding-left:10px}
.topbar .sp{flex:1}
.searchbox{position:relative;width:min(280px,32vw)}
.searchbox svg{position:absolute;left:9px;top:50%;transform:translateY(-50%);color:var(--muted)}
.searchbox input{
  width:100%;padding:7px 10px 7px 31px;border:1px solid var(--border);border-radius:999px;
  background:var(--card2);font-size:13px;color:var(--text);font-family:inherit;
}
.searchbox input::placeholder{color:var(--muted)}
.searchbox input:focus{outline:2px solid var(--accent-bg);border-color:var(--accent);background:var(--card)}
.icon-btn{
  position:relative;display:flex;align-items:center;justify-content:center;
  width:34px;height:34px;border-radius:8px;border:1px solid transparent;
  background:transparent;color:var(--text2);cursor:pointer;
}
.icon-btn:hover{background:var(--card2);border-color:var(--border)}
.icon-btn .count{
  position:absolute;top:2px;right:2px;min-width:16px;height:16px;border-radius:999px;
  background:var(--neg);color:#fff;font-size:10px;font-weight:600;line-height:16px;text-align:center;padding:0 4px;
}
.me{display:flex;align-items:center;gap:9px;padding:4px 12px 4px 4px;border:1px solid var(--border);border-radius:999px;background:var(--card2);font-size:13px}
.av{
  width:28px;height:28px;border-radius:50%;color:#fff;font-size:11px;font-weight:600;
  display:flex;align-items:center;justify-content:center;flex:0 0 auto;letter-spacing:.02em;
}
.av.sm{width:22px;height:22px;font-size:9.5px}

.shell{display:flex;flex:1;min-height:0}
.nav{
  width:236px;flex:0 0 auto;background:var(--card);border-right:1px solid var(--border);
  display:flex;flex-direction:column;overflow-y:auto;padding:10px 0 18px;
}
.nav .group-label{
  font-size:10.5px;font-weight:600;color:var(--muted);text-transform:uppercase;
  letter-spacing:.07em;padding:15px 16px 6px;
}
.nav a{
  display:flex;align-items:center;gap:10px;padding:8px 16px;color:var(--text2);
  text-decoration:none;font-size:13.5px;cursor:pointer;border-left:2px solid transparent;
}
.nav a:hover{background:var(--card2);color:var(--text)}
.nav a.on{background:var(--accent-bg);color:var(--accent-dark);border-left-color:var(--accent);font-weight:600}
.nav a .dot{width:8px;height:8px;border-radius:2px;flex:0 0 auto}
.nav a .tail{margin-left:auto;font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.nav a.on .tail{color:var(--accent-dark)}
.main{flex:1;min-width:0;display:flex;flex-direction:column;overflow:hidden}
.scroll{flex:1;overflow:auto;padding:22px 26px 60px}
.wrap{max-width:1280px;margin:0 auto}

.phead{display:flex;align-items:flex-end;gap:18px;flex-wrap:wrap;margin-bottom:18px}
.phead h1{margin:0;font-size:24px;font-weight:600;letter-spacing:-.015em}
.phead p{margin:5px 0 0;color:var(--muted);font-size:13.5px;max-width:66ch}
.phead .sp{flex:1}
.btn{
  display:inline-flex;align-items:center;gap:7px;border:1px solid var(--border-strong);
  background:var(--card);color:var(--text);padding:8px 14px;border-radius:var(--r);
  font-size:13px;font-weight:500;cursor:pointer;
}
.btn:hover{background:var(--card2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{background:var(--accent-dark);border-color:var(--accent-dark)}
.btn.sm{padding:5px 10px;font-size:12px}

.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:22px}
.tile{background:var(--card);border:1px solid var(--border);border-radius:var(--r-lg);padding:15px 17px;box-shadow:var(--shadow)}
.tile .lab{font-size:11.5px;color:var(--muted);font-weight:500}
.tile .val{font-size:27px;font-weight:600;letter-spacing:-.02em;margin-top:3px;line-height:1.15}
.tile .sub{font-size:11.5px;color:var(--muted);margin-top:3px}
.tile .delta{font-weight:600}
.tile .delta.up{color:var(--pos)}

.panel{background:var(--card);border:1px solid var(--border);border-radius:var(--r-lg);box-shadow:var(--shadow);margin-bottom:22px;overflow:hidden}
.panel > header{display:flex;align-items:center;gap:12px;padding:14px 17px;border-bottom:1px solid var(--border)}
.panel > header h2{margin:0;font-size:14.5px;font-weight:600}
.panel > header .sp{flex:1}
.panel > header .hint{font-size:12px;color:var(--muted)}
.pill{background:var(--card2);color:var(--muted);border-radius:999px;padding:2px 9px;font-size:11px;font-weight:600}
.cols2{display:grid;grid-template-columns:1.55fr 1fr;gap:22px;align-items:start}
.cols2 .panel{margin-bottom:0}

.toolbar{display:flex;align-items:center;gap:8px;padding:10px 14px;background:var(--card);border-bottom:1px solid var(--border);flex-wrap:wrap}
.tabs{display:flex;gap:2px;background:var(--card2);border-radius:999px;padding:3px}
.tab{border:none;background:transparent;color:var(--text2);font-size:12.5px;font-weight:500;padding:5px 13px;border-radius:999px;cursor:pointer}
.tab.on{background:var(--card);color:var(--text);box-shadow:var(--shadow);font-weight:600}
.tblwrap{overflow-x:auto}
table.board{width:100%;border-collapse:collapse;font-size:13px;min-width:900px}
table.board th{
  text-align:left;font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;
  letter-spacing:.05em;padding:8px 10px;border-bottom:1px solid var(--border);white-space:nowrap;
  background:var(--card3);position:sticky;top:0;z-index:2;
}
table.board th.num,table.board td.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
table.board td:last-child{white-space:nowrap}
table.board td{padding:0 10px;height:40px;border-bottom:1px solid var(--border);vertical-align:middle}
table.board tbody tr.row{cursor:pointer}
table.board tbody tr.row:hover td{background:var(--card3)}
tr.grouphead td{background:var(--card2);height:34px;font-weight:600;font-size:12.5px;color:var(--text);border-bottom:1px solid var(--border2)}
tr.grouphead .gh{display:flex;align-items:center;gap:9px}
tr.grouphead button.caret{border:none;background:transparent;cursor:pointer;color:var(--muted);display:flex;padding:2px;border-radius:4px}
tr.grouphead button.caret:hover{background:var(--border)}
tr.grouphead .bar{width:4px;height:15px;border-radius:2px;flex:0 0 auto}
tr.grouphead .sum{margin-left:auto;font-size:11.5px;color:var(--muted);font-weight:500;font-variant-numeric:tabular-nums}
.title-cell{display:flex;align-items:center;gap:9px;min-width:0}
.title-cell .t{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cust-chip{
  display:inline-flex;align-items:center;gap:6px;border:1px solid var(--accent-border);
  background:var(--accent-bg);color:var(--accent-dark);border-radius:999px;
  padding:2px 9px 2px 3px;font-size:12px;font-weight:500;cursor:pointer;max-width:190px;
}
.cust-chip:hover{background:#DBE9EE}
.cust-chip .t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fill{
  display:flex;align-items:center;justify-content:center;min-height:26px;padding:4px 9px;
  border-radius:6px;font-size:12px;font-weight:600;color:#fff;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis;box-shadow:0 1px 2px rgba(0,0,0,.08);
}
td.tight{padding:3px 5px}
.datefill{
  display:flex;align-items:center;justify-content:center;min-height:26px;padding:4px 8px;border-radius:6px;
  font-size:12px;font-weight:500;background:var(--card2);color:var(--text2);white-space:nowrap;
}
.datefill.over{background:var(--neg-bg);color:var(--neg);font-weight:600}
.datefill.soon{background:var(--warn-bg);color:var(--warn);font-weight:600}
.people{display:flex}
.people .av{margin-right:-6px;border:2px solid var(--card)}
.tag{display:inline-block;background:var(--card2);color:var(--text2);border-radius:5px;padding:2px 7px;font-size:11.5px;white-space:nowrap}
.tag.ok{background:var(--pos-bg);color:var(--pos);font-weight:600}
.tag.warn{background:var(--warn-bg);color:var(--warn);font-weight:600}
.ghost{color:var(--muted2);font-size:12px}
.timeline{position:relative;height:10px;border-radius:5px;background:var(--card2);min-width:90px}
.timeline i{position:absolute;top:0;bottom:0;border-radius:5px;background:var(--accent);opacity:.85}
.risk{display:inline-flex;gap:2px}
.risk b{width:7px;height:7px;border-radius:50%;background:var(--border-strong)}
.risk b.on{background:var(--warn)}

.kanban{display:flex;gap:14px;padding:16px;overflow-x:auto;align-items:flex-start}
.kcol{flex:0 0 262px;background:var(--card3);border:1px solid var(--border);border-radius:var(--r-lg);padding:10px}
.kcol h3{margin:0 0 9px;font-size:12px;font-weight:600;display:flex;align-items:center;gap:8px;color:var(--text)}
.kcol h3 .bar{width:4px;height:14px;border-radius:2px}
.kcol h3 .n{margin-left:auto;color:var(--muted);font-size:11px}
.kcard{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:10px 11px;margin-bottom:8px;cursor:pointer;box-shadow:var(--shadow)}
.kcard:hover{border-color:var(--border-strong)}
.kcard .kt{font-size:13px;font-weight:500;margin-bottom:7px}
.kcard .kmeta{display:flex;align-items:center;gap:7px;flex-wrap:wrap;font-size:11.5px;color:var(--muted)}

.rows{display:flex;flex-direction:column}
.rowitem{display:flex;align-items:center;gap:12px;padding:11px 17px;border-bottom:1px solid var(--border);cursor:pointer}
.rowitem:last-child{border-bottom:none}
.rowitem:hover{background:var(--card3)}
.rowitem:focus-visible,tr.row:focus-visible,.custcard:focus-visible,.cust-chip:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.rowitem .body{flex:1;min-width:0}
.rowitem .t{font-size:13.5px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rowitem .m{font-size:11.5px;color:var(--muted);margin-top:2px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.mtime{font-size:12.5px;font-weight:600;color:var(--text2);font-variant-numeric:tabular-nums;width:42px;flex:0 0 auto}
.mtime.past{color:var(--muted2);font-weight:500}
.boardchip{display:inline-flex;align-items:center;gap:5px;background:var(--card2);border-radius:999px;padding:2px 8px;font-size:10.5px;font-weight:500;color:var(--text2)}
.boardchip .dot{width:7px;height:7px;border-radius:50%}
.check{
  width:21px;height:21px;border-radius:50%;border:2px solid var(--border-strong);background:transparent;
  color:transparent;display:flex;align-items:center;justify-content:center;cursor:pointer;flex:0 0 auto;padding:0;
}
.check:hover{border-color:var(--pos);background:var(--pos);color:#fff}
.rowitem.done{opacity:.45}
.rowitem.done .check{border-color:var(--pos);background:var(--pos);color:#fff}
.rowitem.done .t{text-decoration:line-through}

.custgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(268px,1fr));gap:14px}
.custcard{background:var(--card);border:1px solid var(--border);border-radius:var(--r-lg);padding:15px 16px;box-shadow:var(--shadow);cursor:pointer;text-align:left}
.custcard:hover{border-color:var(--accent-border);box-shadow:var(--shadow-md)}
.custcard h3{margin:0;font-size:14.5px;font-weight:600;display:flex;align-items:center;gap:8px}
.custcard .loc{font-size:11.5px;color:var(--muted);margin-top:2px}
.custcard dl{display:grid;grid-template-columns:1fr 1fr;gap:10px 12px;margin:13px 0 0}
.custcard dt{font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.custcard dd{margin:2px 0 0;font-size:14px;font-weight:600;font-variant-numeric:tabular-nums}
.kv{display:grid;grid-template-columns:148px 1fr;gap:9px 14px;font-size:13px;margin:0}
.kv dt{color:var(--muted);font-size:12px}
.kv dd{margin:0}

.figs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:22px}
.fig{background:var(--card);border:1px solid var(--border);border-radius:var(--r-lg);box-shadow:var(--shadow);padding:16px 18px 18px}
.fig h3{margin:0;font-size:14px;font-weight:600}
.fig .cap{margin:3px 0 0;font-size:12px;color:var(--muted)}
.fig .figtop{display:flex;align-items:flex-start;gap:12px;margin-bottom:12px}
.fig .figtop .sp{flex:1}
.switch{display:flex;gap:2px;background:var(--card2);border-radius:6px;padding:2px}
.switch button{border:none;background:transparent;font-size:11.5px;font-weight:500;color:var(--text2);padding:3px 9px;border-radius:4px;cursor:pointer}
.switch button.on{background:var(--card);color:var(--text);font-weight:600;box-shadow:var(--shadow)}
.legend{display:flex;gap:14px;flex-wrap:wrap;margin:0 0 8px;font-size:12px;color:var(--text2)}
.legend i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:6px;vertical-align:-1px}
svg.chart{width:100%;height:auto;display:block;overflow:visible}
svg.chart text{font-family:var(--sans);fill:var(--ink-muted);font-size:11px}
svg.chart text.val{fill:var(--text);font-size:11.5px;font-weight:600}
svg.chart text.cat{fill:var(--text2);font-size:11.5px}
svg.chart .gridline{stroke:var(--grid);stroke-width:1}
svg.chart .axisline{stroke:var(--axis);stroke-width:1}
svg.chart .hit{fill:transparent;cursor:crosshair}
table.data{width:100%;border-collapse:collapse;font-size:12.5px}
table.data th{text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);border-bottom:1px solid var(--border);padding:6px 8px}
table.data td{padding:6px 8px;border-bottom:1px solid var(--border);font-variant-numeric:tabular-nums}
table.data td.r,table.data th.r{text-align:right}
.tip{
  position:fixed;z-index:900;pointer-events:none;background:var(--text);color:#fff;
  border-radius:7px;padding:7px 10px;font-size:12px;box-shadow:var(--shadow-lg);opacity:0;
  transition:opacity .12s;max-width:240px;
}
.tip.on{opacity:1}
.tip b{font-weight:600}
.tip .r{display:flex;align-items:center;gap:7px;margin-top:3px}
.tip .r i{width:9px;height:9px;border-radius:2px;flex:0 0 auto}
.tip .r span{margin-left:auto;font-variant-numeric:tabular-nums;font-weight:600}

.scrim{position:fixed;inset:0;background:rgba(0,0,0,.32);opacity:0;pointer-events:none;transition:opacity .2s;z-index:800}
.scrim.on{opacity:1;pointer-events:auto}
.detail{
  position:fixed;top:0;right:0;bottom:0;width:min(560px,94vw);background:var(--card);
  border-left:1px solid var(--border);box-shadow:var(--shadow-lg);z-index:810;
  transform:translateX(102%);transition:transform .24s cubic-bezier(.22,.9,.28,1);
  display:flex;flex-direction:column;
}
.detail.on{transform:translateX(0)}
.detail > header{padding:16px 18px 12px;border-bottom:1px solid var(--border)}
.detail h2{margin:0 0 3px;font-size:17px;font-weight:600;letter-spacing:-.01em;padding-right:36px}
.detail .close{position:absolute;top:12px;right:14px}
.detail .meta{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px 14px;margin-top:12px}
.detail .meta .lab{font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:3px}
.dtabs{display:flex;gap:4px;padding:0 18px;border-bottom:1px solid var(--border);background:var(--card)}
.dtab{border:none;background:transparent;padding:10px 4px;margin-right:14px;font-size:13px;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;font-weight:500}
.dtab.on{color:var(--text);border-bottom-color:var(--accent);font-weight:600}
.dbody{flex:1;overflow-y:auto;padding:16px 18px 28px}
.dbody h3.sec{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:20px 0 9px}
.dbody h3.sec:first-child{margin-top:0}
.composer{border:1px solid var(--border);border-radius:var(--r);padding:10px;margin-bottom:16px;background:var(--card3)}
.composer textarea{width:100%;border:none;background:transparent;resize:vertical;min-height:54px;font-family:inherit;font-size:13px;color:var(--text)}
.composer textarea:focus{outline:none}
.composer .cact{display:flex;align-items:center;gap:9px;border-top:1px solid var(--border);padding-top:9px;margin-top:6px}
.composer .cact .sp{flex:1}
.upd{display:flex;gap:11px;padding:12px 0;border-top:1px solid var(--border)}
.upd:first-of-type{border-top:none}
.upd .ub{flex:1;min-width:0}
.upd .uh{display:flex;align-items:baseline;gap:8px;font-size:12.5px}
.upd .uh b{font-size:13px;font-weight:600}
.upd .uh time{color:var(--muted);font-size:11.5px}
.upd p{margin:4px 0 0;font-size:13px;color:var(--text2)}
.upd .men{color:var(--accent-dark);background:var(--accent-bg);border-radius:4px;padding:0 3px;font-weight:500}
.filecard{display:flex;align-items:center;gap:11px;border:1px solid var(--border);border-radius:var(--r);padding:10px 12px;margin-bottom:9px}
.filecard .fi{width:34px;height:34px;border-radius:6px;background:var(--card2);display:flex;align-items:center;justify-content:center;color:var(--muted)}
.filecard .fn{font-size:13px;font-weight:500}
.filecard .fm{font-size:11.5px;color:var(--muted)}
.act{display:flex;gap:10px;padding:9px 0;border-top:1px solid var(--border);font-size:12.5px;color:var(--text2)}
.act:first-child{border-top:none}
.act time{color:var(--muted);flex:0 0 84px;font-size:11.5px}
.drop{border:1px dashed var(--border-strong);border-radius:var(--r);padding:20px;text-align:center;color:var(--muted);font-size:12.5px;background:var(--card3);margin-bottom:14px}
.bullets{margin:0;padding-left:20px;font-size:13px;color:var(--text2)}
.bullets li{margin-bottom:7px}
.exline{display:flex;align-items:flex-start;gap:10px;padding:10px 0;border-top:1px solid var(--border);font-size:13px}
.exline:first-of-type{border-top:none}
.exline .cb{width:19px;height:19px;border-radius:5px;border:2px solid var(--border-strong);flex:0 0 auto;background:transparent;cursor:pointer;display:flex;align-items:center;justify-content:center;color:transparent;padding:0}
.exline .cb:hover{border-color:var(--accent);color:var(--accent)}
.exline.taken .cb{background:var(--accent);border-color:var(--accent);color:#fff}
.exline.taken .xt{color:var(--text2)}

.notifs{
  position:fixed;top:92px;right:18px;width:min(360px,92vw);background:var(--card);
  border:1px solid var(--border);border-radius:var(--r-lg);box-shadow:var(--shadow-lg);
  z-index:820;display:none;overflow:hidden;
}
.notifs.on{display:block}
.notifs header{display:flex;align-items:center;padding:12px 15px;border-bottom:1px solid var(--border)}
.notifs header h3{margin:0;font-size:13.5px;font-weight:600;flex:1}
.notif{display:flex;gap:11px;padding:11px 15px;border-bottom:1px solid var(--border);font-size:13px}
.notif:last-child{border-bottom:none}
.notif.unread{background:var(--accent-bg)}
.notif .nb{flex:1}
.notif .nt{color:var(--text2)}
.notif time{font-size:11px;color:var(--muted)}

.note{background:var(--accent-bg);border:1px solid var(--accent-border);border-radius:var(--r);padding:12px 14px;font-size:13px;color:var(--accent-dark);margin-bottom:20px}
.note b{font-weight:600}

@media (max-width:1120px){
  .tiles{grid-template-columns:repeat(2,1fr)}
  .cols2{grid-template-columns:1fr}
  .figs{grid-template-columns:1fr}
}
@media (max-width:820px){
  .nav{position:fixed;top:0;bottom:0;left:0;z-index:830;transform:translateX(-103%);transition:transform .2s;box-shadow:var(--shadow-lg)}
  .nav.open{transform:translateX(0)}
  .scroll{padding:16px 14px 60px}
  .brand .sub{display:none}
  .searchbox{display:none}
  .phead h1{font-size:20px}
  .ribbon span:nth-of-type(3){display:none}
  .tiles{grid-template-columns:1fr 1fr;gap:10px}
  .tile .val{font-size:22px}
}
@media (max-width:430px){
  .me .mename{display:none}
  .me{padding:4px}
  .brand .bname{display:none}
  .brandmark{height:24px}
}
@media (min-width:821px){ .navtoggle{display:none} }
</style>
</head>

  if (!iso) return `<span class="ghost">—</span>`;
  const d = new Date(iso), diff = Math.round((d - TODAY) / 86400000);
  const cls = diff < 0 ? "over" : diff <= 3 ? "soon" : "";
  const lab = d.toLocaleDateString("en-CA",{month:"short",day:"numeric"});
  return `<span class="datefill ${cls}">${lab}${diff<0?" · late":""}</span>`;
};

function renderNav(){
  let html = "", lastGroup = null;
  for (const v of VIEWS){
    if (v.group !== lastGroup){
      if (v.group) html += `<div class="group-label">${esc(v.group)}</div>`;
      lastGroup = v.group;
    }
    const tail = typeof v.tail === "function" ? v.tail() : v.tail;
    html += `<a data-view="${v.id}" class="${v.id===current?"on":""}">`
         +  (v.dot ? `<span class="dot" style="background:${v.dot}"></span>`
                   : `<svg class="i"><use href="#${v.icon}"/></svg>`)
         +  `<span>${esc(v.label)}</span>`
         +  (tail !== undefined ? `<span class="tail">${tail}</span>` : "")
         +  `</a>`;
  }
  $("#nav").innerHTML = html;
}
function wireFocus(){
  document.querySelectorAll("[data-item],[data-cust],[data-meeting]").forEach(el => {
    if (!el.hasAttribute("tabindex") && el.tagName !== "BUTTON") el.tabIndex = 0;
  });
}
const ROUTES = {
  home:() => viewHome(), pipeline:() => viewPipeline(), accounts:() => viewAccounts(),
  salesstats:() => viewSalesStats(), field:() => viewProjects("field"),
  stack:() => viewProjects("stack"), grants:() => viewProjects("grants"),
  approvals:() => viewApprovals(), finstats:() => viewFinStats()
};
function go(id, skipHash){
  if (!ROUTES[id]) id = "home";
  current = id; renderNav();
  $("#scroll").scrollTop = 0;
  $("#nav").classList.remove("open");
  if (!skipHash && location.hash.slice(1) !== id) location.hash = id;
  ROUTES[id]();
  wireFocus();
}
window.addEventListener("hashchange", () => {
  const id = location.hash.slice(1);
  if (id && id !== current) go(id, true);
});
/* Every in-view re-render (Table/Kanban, group collapse, a decision) replaces rows,

const collapsed = new Set();
const boardMode = {pipeline:"table", field:"table", stack:"table", grants:"table"};

function boardShell(key, title, desc, members, body){
  return `
    <div class="phead">
      <div><h1>${esc(title)}</h1><p>${desc}</p></div>
      <span class="sp"></span>
      <div class="people" style="margin-right:8px">${people(members)}</div>
      <button class="btn"><svg class="i"><use href="#i-plus"/></svg> Column</button>
      <button class="btn primary"><svg class="i"><use href="#i-plus"/></svg> New item</button>
    </div>
    <section class="panel">
      <div class="toolbar">
        <div class="tabs">
          <button class="tab ${boardMode[key]==="table"?"on":""}" data-mode="${key}:table">Table</button>
          <button class="tab ${boardMode[key]==="kanban"?"on":""}" data-mode="${key}:kanban">Kanban</button>
        </div>
        <span class="sp" style="flex:1"></span>
        <span class="hint" style="font-size:12px;color:var(--muted)">Click any row to open it</span>
      </div>
      ${body}
    </section>`;
}

function groupedTable(groups, rows, cols, sumKey, groupKey){
  let html = `<div class="tblwrap"><table class="board"><thead><tr>`;
  cols.forEach(c => html += `<th class="${c.num?"num":""}">${esc(c.t)}</th>`);
  html += `</tr></thead><tbody>`;
  for (const g of groups){
    const gr = rows.filter(r => r[groupKey] === g.id);
    if (!gr.length) continue;
    const isOpen = !collapsed.has(g.id);
    const sum = sumKey ? gr.reduce((s,r) => s + (r[sumKey]||0), 0) : 0;
    html += `<tr class="grouphead"><td colspan="${cols.length}"><div class="gh">
        <button class="caret" data-group="${g.id}" aria-label="Collapse group">
          <svg class="i" style="transform:rotate(${isOpen?90:0}deg);transition:transform .15s"><use href="#i-caret"/></svg></button>
        <span class="bar" style="background:${g.c}"></span>${esc(g.t)}
        <span class="pill">${gr.length}</span>
        ${sum ? `<span class="sum">${cad(sum)}</span>` : ""}
      </div></td></tr>`;
    if (isOpen) for (const r of gr){
      html += `<tr class="row" data-item="${r.id}">`;
      cols.forEach(c => html += `<td class="${c.num?"num":""} ${c.tight?"tight":""}">${c.cell(r)}</td>`);
      html += `</tr>`;
    }
  }
  return html + `</tbody></table></div>`;
}

function kanban(colIds, rows, statusKey, map){
  return `<div class="kanban">` + colIds.map(id => {
    const cards = rows.filter(r => r[statusKey] === id);
    return `<div class="kcol">
      <h3><span class="bar" style="background:${map[id].c}"></span>${esc(map[id].t)}<span class="n">${cards.length}</span></h3>
      ${cards.map(r => `<div class="kcard" data-item="${r.id}">
          <div class="kt">${esc(r.t)}</div>
          <div class="kmeta">${people(r.own)}${r.cust ? `<span class="tag">${esc(custById(r.cust).name)}</span>` : ""}
            ${r.val ? `<span class="tag">${k$(r.val)}</span>` : ""}${r.jira && r.jira!=="—" ? `<span class="tag">${esc(r.jira)}</span>` : ""}</div>

function figHead(id, title, cap){

function drawAccounts(mode){
  const d = REV_BY_ACCOUNT, max = Math.max(...d.map(x => x.v));
  const rowH = 36, padT = 6, labW = 152, valW = 96, plotW = 286, h = d.length*rowH + padT + 6;
  const W = labW + plotW + valW;
  const chart = `
    <svg class="chart" viewBox="0 0 ${W} ${h}" role="img" aria-label="Revenue by account, last 12 months">
      ${d.map((x,i) => {
        const y = padT + i*rowH, bw = Math.max((x.v/max)*plotW, 3);
        return `<g class="bhit" data-tip="${esc(x.k)}|${cad(x.v)}">
          <text class="cat" x="${labW-12}" y="${y+18}" text-anchor="end">${esc(x.k.length>22?x.k.slice(0,21)+"…":x.k)}</text>
          <path d="M${labW} ${y+6} h${bw-4} a4,4 0 0 1 4,4 v${12} a4,4 0 0 1 -4,4 h${-(bw-4)} z" fill="var(--s1)"></path>
          <text class="val" x="${labW+bw+10}" y="${y+18}">${cad(x.v)}</text>
          <rect class="hit" x="${labW}" y="${y}" width="${plotW+valW}" height="${rowH-2}"></rect>
        </g>`;
      }).join("")}
    </svg>`;
  const total = d.reduce((s,y) => s + y.v, 0);
  const table = `<table class="data"><thead><tr><th>Account</th><th class="r">Revenue, 12 m</th><th class="r">Share</th></tr></thead><tbody>
    ${d.map(x => `<tr><td>${esc(x.k)}</td><td class="r">${cad(x.v)}</td><td class="r">${Math.round(x.v/total*100)}%</td></tr>`).join("")}
    </tbody></table>`;
  $("#fig-acc").innerHTML = figHead("acc","Revenue by account","Last 12 months. Two accounts carry 70% of it.")
    + (mode === "table" ? table : chart);
}

function drawStages(mode){
  const d = pipelineByStage(), ramp = ["#86b6ef","#5598e7","#2a78d6","#184f95"];
  const W = 540, H = 262, padL = 58, padR = 14, padT = 18, base = H - 50;
  const max = 300000, plotW = W - padL - padR, band = plotW / d.length, bw = 24;
  const ticks = [0,100000,200000,300000];
  const chart = `
    <svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Open pipeline value by stage">
      ${ticks.map(t => {
        const y = base - (t/max)*(base-padT);
        return `<line class="${t===0?"axisline":"gridline"}" x1="${padL}" y1="${y}" x2="${W-padR}" y2="${y}"></line>
                <text x="${padL-10}" y="${y+4}" text-anchor="end">${t?Math.round(t/1000)+"k":"0"}</text>`;
      }).join("")}
      ${d.map((x,i) => {
        const cx = padL + band*i + band/2, bh = Math.max((x.v/max)*(base-padT), 3), y = base - bh;
        return `<g class="bhit" data-tip="${esc(x.k)}|${cad(x.v)} · ${x.n} item${x.n===1?"":"s"}">
          <path d="M${cx-bw/2} ${base} v${-(bh-4)} a4,4 0 0 1 4,-4 h${bw-8} a4,4 0 0 1 4,4 v${bh-4} z" fill="${ramp[i]}"></path>
          <text class="val" x="${cx}" y="${y-8}" text-anchor="middle">${Math.round(x.v/1000)}k</text>
          <text class="cat" x="${cx}" y="${base+18}" text-anchor="middle">${esc(x.k)}</text>
          <text x="${cx}" y="${base+32}" text-anchor="middle">${x.n} item${x.n===1?"":"s"}</text>
          <rect class="hit" x="${cx-band/2}" y="${padT}" width="${band}" height="${base-padT}"></rect>
        </g>`;
      }).join("")}
    </svg>`;
  const table = `<table class="data"><thead><tr><th>Stage</th><th class="r">Items</th><th class="r">Value</th></tr></thead><tbody>
    ${d.map(x => `<tr><td>${esc(x.k)}</td><td class="r">${x.n}</td><td class="r">${cad(x.v)}</td></tr>`).join("")}
    </tbody></table>`;
  $("#fig-stage").innerHTML = figHead("stage","Open pipeline by stage","Counted straight off the pipeline board, CAD.")
    + (mode === "table" ? table : chart);
}

function drawTrend(mode){
  const W = 1140, H = 340, padL = 64, padR = 112, padT = 20, base = H - 50;
  const max = 150, plotW = W - padL - padR, step = plotW / (MONTHS.length - 1);
  const x = i => padL + i*step, y = v => base - (v/max)*(base-padT);
  const path = arr => arr.map((v,i) => (i?"L":"M") + x(i).toFixed(1) + " " + y(v).toFixed(1)).join(" ");
  const ticks = [0,50,100,150];
  const series = [
    {k:"2026", raw:"#2a78d6", d:TREND.y2026},
    {k:"2025", raw:"#eb6834", d:TREND.y2025}
  ];
  const chart = `
    <div class="legend">${series.map(s => `<span><i style="background:${s.raw}"></i>${s.k}</span>`).join("")}</div>
    <svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Monthly revenue, 2026 against 2025">
      ${ticks.map(t => `<line class="${t===0?"axisline":"gridline"}" x1="${padL}" y1="${y(t)}" x2="${W-padR}" y2="${y(t)}"></line>
        <text x="${padL-10}" y="${y(t)+4}" text-anchor="end">${t}k</text>`).join("")}
      ${MONTHS.map((m,i) => `<text class="cat" x="${x(i)}" y="${base+20}" text-anchor="middle">${m}</text>`).join("")}
      ${series.map(s => `<path d="${path(s.d)}" fill="none" stroke="${s.raw}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"></path>`).join("")}
      ${series.map(s => {
        const i = s.d.length-1;
        return `<circle cx="${x(i)}" cy="${y(s.d[i])}" r="4.5" fill="${s.raw}" stroke="var(--card)" stroke-width="2"></circle>
                <text class="val" x="${x(i)+12}" y="${y(s.d[i])+4}">${s.k} · ${s.d[i]}k</text>`;
      }).join("")}
      ${MONTHS.map((m,i) => `<g class="lhit" data-month="${i}">
          <rect class="hit" x="${x(i)-step/2}" y="${padT}" width="${step}" height="${base-padT}"></rect></g>`).join("")}
      <line id="cross" x1="0" y1="${padT}" x2="0" y2="${base}" stroke="var(--axis)" stroke-width="1" opacity="0"></line>
    </svg>`;
  const table = `<table class="data"><thead><tr><th>Month</th><th class="r">2026 (CAD k)</th><th class="r">2025 (CAD k)</th></tr></thead><tbody>
    ${MONTHS.map((m,i) => `<tr><td>${m}</td><td class="r">${TREND.y2026[i]}</td><td class="r">${TREND.y2025[i]}</td></tr>`).join("")}
    </tbody></table>`;
  $("#fig-trend").innerHTML = figHead("trend","Monthly revenue","CAD thousands, invoiced. This year against the same months last year.")
    + (mode === "table" ? table : chart);
}

          <button class="cb" aria-label="Keep on the board"><svg class="i"><use href="#i-check"/></svg></button>
          <div style="flex:1"><span class="xt">${esc(t.t)}</span>
            <div style="font-size:11.5px;color:var(--muted);margin-top:3px">${esc(P[t.own].n)} · ${esc(t.board)}</div></div>
        </div>`).join("")}
       <p style="font-size:12px;color:var(--muted);margin:14px 0 0">All three are on the boards already. Untick one to take it back off.</p>`
    : `<h3 class="sec">Brief</h3>
       <ul class="bullets">${m.brief.map(b => `<li>${esc(b)}</li>`).join("")}</ul>
       ${m.cust ? `<h3 class="sec">Account</h3>${custChip(m.cust)}` : ""}
       <h3 class="sec">After the meeting</h3>
       <p style="margin:0;font-size:13px;color:var(--muted)">A summary lands here when the meeting ends, with the tasks pulled out of it for you to keep or drop.</p>`;
  showDetail(`
    <header style="position:relative">
      <button class="icon-btn close" id="dclose" aria-label="Close"><svg class="i lg"><use href="#i-x"/></svg></button>
      <h2>${esc(m.t)}</h2>
      <div style="font-size:12.5px;color:var(--muted)">${m.time} · ${esc(m.place)}</div>
      <div class="meta">
        <div><div class="lab">Attendees</div><div style="margin-top:3px">${people(m.who)}</div></div>
        <div><div class="lab">Status</div>${m.state === "done" ? `<span class="tag ok">Done</span>` : `<span class="tag warn">Later today</span>`}</div>
      </div>
      <div style="display:flex;gap:8px;margin-top:14px">
        ${m.state === "done"
          ? `<button class="btn"><svg class="i"><use href="#i-file"/></svg> Full notes</button>`
          : `<button class="btn primary"><svg class="i"><use href="#i-video"/></svg> Join</button>
             <button class="btn">Add to the brief</button>`}
      </div>
    </header>
    <div class="dbody">${body}</div>`);
}

function findItem(id){
  const inCrm = CRM.find(r => r.id === id);
  if (inCrm) return {kind:"crm", r:inCrm};
  const inProj = PROJ.find(r => r.id === id);
  if (inProj) return {kind:"proj", r:inProj};
  const inAppr = APPROVALS.find(r => r.id === id);
  if (inAppr) return {kind:"appr", r:inAppr};
  const mine = MY_ITEMS.find(r => r.id === id);
  if (mine) return {kind:"mine", r:mine};
  return null;
}
function openItem(id){
  const found = findItem(id);
  if (!found) return;
  const {kind, r} = found;
  const thread = THREADS[id] || [{who:"SYS",t:"today",m:"No updates on this item yet. This is where the conversation about it would live, instead of in four separate inboxes."}];
  const files = FILES[id] || [];
  const acts = ACTIVITY[id] || [{t:"today",m:"Item created"}];

  let meta = "", where = "";
  if (kind === "crm"){
    where = "Pipeline · Sales";
    meta = `
      <div><div class="lab">Account</div>${custChip(r.cust)}</div>
      <div><div class="lab">Stage</div>${fill(STAGE,r.stage)}</div>
      <div><div class="lab">Next step</div>${dateCell(r.next)}</div>
      <div><div class="lab">Value</div><strong>${r.val?cad(r.val):"—"}</strong></div>
      <div><div class="lab">Owner</div><div style="margin-top:3px">${people(r.own)}</div></div>
      <div><div class="lab">Source</div><span class="tag">${esc(r.src)}</span></div>`;
  } else if (kind === "proj"){
    where = PROJ_VIEWS[r.dept].title + " · " + PROJ_VIEWS[r.dept].dept;
    meta = `
      <div><div class="lab">Phase</div>${fill(PHASE,r.phase)}</div>
      <div><div class="lab">Account</div>${custChip(r.cust)}</div>
      <div><div class="lab">JIRA</div><span class="tag">${esc(r.jira)}</span></div>
      <div><div class="lab">Owner</div><div style="margin-top:3px">${people(r.own)}</div></div>`;
  } else if (kind === "appr"){
    where = "Invoices & expenses · Finance";
    meta = `
      <div><div class="lab">Type</div><span class="tag">${esc(r.kind)}</span></div>
      <div><div class="lab">Amount</div><strong style="font-size:16px">${cad(r.amt)}</strong></div>
      <div><div class="lab">Due</div>${dateCell(r.due)}</div>
      <div><div class="lab">Status</div>${fill(APPR,r.st)}</div>
      <div><div class="lab">Requested by</div><div style="margin-top:3px">${av(r.who,"sm")} <span style="font-size:12.5px">${esc(P[r.who].n)}</span></div></div>
      <div><div class="lab">Account</div>${custChip(r.cust)}</div>`;
  } else {
    where = r.board;
    meta = `
      <div><div class="lab">Board</div><span class="boardchip"><span class="dot" style="background:${r.bc}"></span>${esc(r.board)}</span></div>
      <div><div class="lab">Due</div>${dateCell(r.due)}</div>`;
  }

  const approveBar = (kind === "appr" && r.st === "pending")
    ? `<div style="display:flex;gap:8px;margin-top:14px">
         <button class="btn primary" data-approve="${r.id}"><svg class="i"><use href="#i-check"/></svg> Approve</button>
         <button class="btn" data-reject="${r.id}"><svg class="i"><use href="#i-x"/></svg> Reject</button>
         <button class="btn">Ask a question</button></div>` : "";

  showDetail(`
    <header style="position:relative">
      <button class="icon-btn close" id="dclose" aria-label="Close"><svg class="i lg"><use href="#i-x"/></svg></button>
      <h2>${esc(r.t)}</h2>
      <div style="font-size:12.5px;color:var(--muted)">${esc(where)}</div>
      <div class="meta">${meta}</div>
      ${approveBar}
    </header>
    <div class="dtabs">
      <button class="dtab on" data-dtab="upd">Updates <span class="pill">${thread.length}</span></button>
      <button class="dtab" data-dtab="files">Files <span class="pill">${files.length}</span></button>
      <button class="dtab" data-dtab="act">Activity</button>
    </div>
    <div class="dbody" id="dpane"></div>`);

  const panes = {
    upd: `<div class="composer">
        <textarea placeholder="Write an update… use @ to mention someone"></textarea>
        <div class="cact"><button class="btn sm"><svg class="i"><use href="#i-file"/></svg> Attach</button>
          <span class="sp"></span><button class="btn sm primary">Post</button></div>
      </div>
      ${thread.map(u => `<div class="upd">${av(u.who)}
        <div class="ub"><div class="uh"><b>${esc(P[u.who].n)}</b><time>${esc(u.t)}</time></div>
          <p>${u.m.replace(/@([A-ZÉ][\wéèêç-]+ [A-ZÉ][\wéèêç.-]+)/g, '<span class="men">@$1</span>')}</p></div>
      </div>`).join("")}`,
    files: `<div class="drop">Drag files here, or paste a screenshot</div>
      ${files.map(f => `<div class="filecard"><span class="fi"><svg class="i"><use href="#i-file"/></svg></span>
        <div style="flex:1"><div class="fn">${esc(f.n)}</div><div class="fm">${esc(f.m)}</div></div></div>`).join("")
        || `<div style="color:var(--muted);font-size:12.5px">No files on this item.</div>`}`,
    act: acts.map(a => `<div class="act"><time>${esc(a.t)}</time><span>${esc(a.m)}</span></div>`).join("")
  };
  $("#dpane").innerHTML = panes.upd;
  $("#detail").addEventListener("click", e => {
    const tab = e.target.closest("[data-dtab]");
    if (!tab) return;
    $("#detail").querySelectorAll(".dtab").forEach(t => t.classList.toggle("on", t === tab));
    $("#dpane").innerHTML = panes[tab.dataset.dtab];
  });
}

function renderNotifs(){
  $("#notifs").innerHTML = `
    <header><h3>Notifications</h3><button class="btn sm">Mark all read</button></header>
    ${NOTIFS.map(n => `<div class="notif ${n.unread?"unread":""}">${av(n.who,"sm")}
      <div class="nb"><div class="nt"><b>${esc(P[n.who].n.split(" ")[0])}</b> ${n.txt}</div><time>${esc(n.t)}</time></div>
    </div>`).join("")}`;
}

/* ═══════════════════════════════════════════════════════════
   Events
   ═══════════════════════════════════════════════════════════ */
const tip = $("#tip");
function showTip(html, x, y){
  tip.innerHTML = html;
  tip.classList.add("on");
  const r = tip.getBoundingClientRect();
  tip.style.left = Math.min(x + 14, window.innerWidth - r.width - 10) + "px";
  tip.style.top  = Math.max(y - r.height - 12, 8) + "px";
}
const hideTip = () => tip.classList.remove("on");

document.addEventListener("click", e => {
  const meet = e.target.closest("[data-meeting]");
  if (meet){ openMeeting(meet.dataset.meeting); return; }

  const nav = e.target.closest("[data-view]");
  if (nav){ go(nav.dataset.view); return; }

  const mode = e.target.closest("[data-mode]");
  if (mode){
    const [key, m] = mode.dataset.mode.split(":");
    boardMode[key] = m;
    key === "pipeline" ? viewPipeline() : viewProjects(key);
    return;
  }
  const grp = e.target.closest("[data-group]");
  if (grp){
    const id = grp.dataset.group;
    collapsed.has(id) ? collapsed.delete(id) : collapsed.add(id);
    current === "pipeline" ? viewPipeline() : viewProjects(current);
    return;
  }
  const fmode = e.target.closest("[data-fmode]");
  if (fmode){
    const box = fmode.closest("[data-fig]");
    box.querySelectorAll("button").forEach(b => b.classList.toggle("on", b === fmode));
    ({acc:drawAccounts, stage:drawStages, trend:drawTrend, prod:drawProducts}[box.dataset.fig])(fmode.dataset.fmode);
    return;
  }
  const task = e.target.closest("[data-task]");
  if (task){ task.classList.toggle("taken"); return; }

  const cust = e.target.closest("[data-cust]");
  if (cust){ openCustomer(cust.dataset.cust); return; }

  const ap = e.target.closest("[data-approve]"), rj = e.target.closest("[data-reject]");
  if (ap || rj){
    const id = (ap || rj).dataset[ap ? "approve" : "reject"];
    const row = APPROVALS.find(a => a.id === id);
    if (row) row.st = ap ? "approved" : "rejected";
    closeDetail(); renderNav();
    current === "approvals" ? viewApprovals() : viewHome();
    return;
  }
  const done = e.target.closest("[data-done]");
  if (done){ done.closest(".rowitem").classList.toggle("done"); return; }

  const item = e.target.closest("[data-item]");
  if (item){ openItem(item.dataset.item); return; }

  if (e.target.closest("#dclose") || e.target.closest("#scrim")){ closeDetail(); return; }
  if (e.target.closest("#bell")){ $("#notifs").classList.toggle("on"); return; }
  if (e.target.closest("#navtoggle")){ $("#nav").classList.toggle("open"); return; }
  if (!e.target.closest("#notifs")) $("#notifs").classList.remove("on");
});

document.addEventListener("keydown", e => {
  if (e.key === "Escape"){ closeDetail(); return; }
  if (e.key === "Enter" || e.key === " "){
    const el = document.activeElement;
    if (!el) return;
    if (el.matches("[data-meeting]")){ e.preventDefault(); openMeeting(el.dataset.meeting); }
    else if (el.matches("[data-item]")){ e.preventDefault(); openItem(el.dataset.item); }
    else if (el.matches("[data-cust]")){ e.preventDefault(); openCustomer(el.dataset.cust); }
  }
});

document.addEventListener("mouseover", e => {
  const b = e.target.closest(".bhit");
  if (b && b.dataset.tip){
    const [a, v] = b.dataset.tip.split("|");
    showTip(`<b>${esc(a)}</b><div class="r"><i style="background:#2a78d6"></i><span>${esc(v)}</span></div>`, e.clientX, e.clientY);
    return;
  }
  const l = e.target.closest(".lhit");
  if (l){
    const i = +l.dataset.month;
    showTip(`<b>${MONTHS[i]}</b>
      <div class="r"><i style="background:#2a78d6"></i>2026<span>${TREND.y2026[i]}k</span></div>
      <div class="r"><i style="background:#eb6834"></i>2025<span>${TREND.y2025[i]}k</span></div>`, e.clientX, e.clientY);
    const svg = l.closest("svg"), cross = svg && svg.querySelector("#cross");
    if (cross){ const bb = l.querySelector("rect").getBBox(); cross.setAttribute("x1", bb.x + bb.width/2); cross.setAttribute("x2", bb.x + bb.width/2); cross.setAttribute("opacity","0.55"); }
    return;
  }
  if (!e.target.closest(".tip")){
    hideTip();
    const cross = document.querySelector("#cross");
    if (cross) cross.setAttribute("opacity","0");
  }
});
document.addEventListener("mousemove", e => {
  if (tip.classList.contains("on") && (e.target.closest(".bhit") || e.target.closest(".lhit"))){
    const r = tip.getBoundingClientRect();
    tip.style.left = Math.min(e.clientX + 14, window.innerWidth - r.width - 10) + "px";
    tip.style.top  = Math.max(e.clientY - r.height - 12, 8) + "px";
  }
});

renderNav(); renderNotifs(); go(location.hash.slice(1) || "home", true);
</script>
</body>
</html>
